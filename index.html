/* Mobile layout refinement: preserve data and existing visual identity. */
html,body{max-width:100%;overflow-x:clip}
.main,.panel,.story,.item,.item>div,.toolbar,.field{min-width:0}
.item b,.story,.notice,.reporttext,.empty{overflow-wrap:anywhere}
.item .toolbar{flex-shrink:0}
.field input,.field select,.field textarea{max-width:100%;min-width:0}
.sticker-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.sticker-choice{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:11px 10px;background:white;cursor:pointer;font-size:13px}.sticker-choice:has(input:checked){background:var(--sage2);border-color:var(--sage);font-weight:700}.sticker-choice input{accent-color:var(--sage);width:auto!important;margin:0}.sticker-detail{margin-top:10px}.sticker-help{font-size:12px;color:var(--muted);line-height:1.6}@media(min-width:850px){.sticker-choices{grid-template-columns:repeat(4,minmax(0,1fr))}}
.advanced-record{border:1px solid var(--line);border-radius:12px;margin-top:16px;padding:0 14px 14px;background:#fafcfb}
.advanced-record summary{cursor:pointer;padding:14px 0;font-weight:700;color:var(--sage);list-style-position:inside}
.advanced-record[open] summary{margin-bottom:10px;border-bottom:1px solid var(--line)}
@media(max-width:700px){
 .main{width:100%;max-width:100vw;padding:18px 13px calc(108px + env(safe-area-inset-bottom))}
 .top .toolbar{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto}
 .top .toolbar #month{width:100%!important;min-width:0}
 .top .toolbar .btn{white-space:nowrap}
 .panel{padding:16px 14px;border-radius:15px}
 .item{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:15px 0}
 .item>.toolbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);width:100%;gap:8px}
 .item>.toolbar .btn{width:100%;padding:10px 6px;white-space:normal;overflow-wrap:anywhere}
 .toolbar{gap:8px}
 .toolbar>.btn{max-width:100%;white-space:normal}
 .storytop{flex-wrap:wrap}
 .day{min-width:0;overflow:hidden}

 .mobile-nav{grid-template-columns:repeat(5,minmax(0,1fr));padding-left:max(4px,env(safe-area-inset-left));padding-right:max(4px,env(safe-area-inset-right))}

}
@media(max-width:370px){.main{padding-left:10px;padding-right:10px}.panel{padding:13px 11px}.calendar{gap:2px}.day{padding:5px 3px}.mobile-nav button{font-size:9px}}

.daily-list,.daily-row,.panel{min-width:0}.daily-list{width:100%;max-width:100%}.daily-row{margin:14px 0}.daily-label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.daily-row .track{width:100%;height:12px;overflow:hidden}.daily-list .toolbar{flex-wrap:wrap}.daily-list .btn{white-space:normal}.daily-label span{min-width:0;overflow-wrap:anywhere}
 .report-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.report-kpi{background:#f1f5f1;border:1px solid var(--line);border-radius:14px;padding:13px;min-width:0;overflow-wrap:anywhere}.report-kpi .metric{font-size:clamp(19px,5vw,28px);color:#465f59}.report-hero h2{margin-top:12px}.report-bar{margin:16px 0}.report-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px}.report-line span{min-width:0;overflow-wrap:anywhere}.report-line b{flex:none}.report-bar .fill{background:#829b8d}.report-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}.report-table th,.report-table td{padding:10px 4px;border-bottom:1px solid var(--line);text-align:right;overflow-wrap:anywhere}.report-table th:first-child,.report-table td:first-child{text-align:left;width:44%}details summary{cursor:pointer;padding:8px 0} @media(max-width:700px){.report-kpi{padding:11px}.report-grid{gap:8px}} </style></head><body><div class="app"><aside class="side"><div class="brand">限動經營工作台</div><div class="brand-sub">內容企劃 · 成效紀錄 · 數據分析</div><nav id="nav" class="nav"></nav><div class="footnote">資料僅儲存於目前瀏覽器。<br>請定期下載完整備份。</div></aside><main class="main"><header class="top"><div><div class="eyebrow">STORY WORKSPACE · V2.1</div><h1 id="heading">首頁總覽</h1><div id="subtitle" class="muted">讓每一則限動，都有清楚的方向。</div></div><div class="toolbar"><input id="month" type="month" class="control" style="width:170px" aria-label="選擇月份"><button class="btn" id="backupTop">下載備份</button></div></header><div id="view"></div></main></div><nav id="mobileNav" class="mobile-nav"></nav><div id="toast" class="toast hidden" role="status"></div><input id="importFile" type="file" accept="application/json,.json" hidden><script>
'use strict';
const KEY='story-workspace-v1', PAGES=[['home','⌂','首頁總覽'],['plan','▣','限動企劃'],['record','✎','成效紀錄'],['analysis','▥','數據分析'],['report','▤','月度報告']];
const TOPICS=['記帳與預算','儲蓄與目標','消費與金錢觀','投資入門','財務規劃','理財工具與資源','個人故事','日常生活','其他'];
const CATS=[...TOPICS,'理財知識','粉絲互動','貼文導流'];
const PURPOSES=['暖場預告','知識分享','粉絲互動','貼文導流','生活連結','後續延伸'];
const FORMATS=['文字圖卡','生活照片','人物／自拍','影片','數據／圖表','貼文／Reels 轉發','其他'];
const GUIDES={ '記帳與預算':'掌握收入支出與預算。例如：月底檢視支出。','儲蓄與目標':'建立存錢習慣與目標。例如：儲蓄率、緊急預備金。','消費與金錢觀':'理解消費心理與金錢選擇。例如：情緒消費。','投資入門':'投資基本觀念與風險。例如：ETF、定期定額。','財務規劃':'長期財務安排與保障。例如：退休、保險。','理財工具與資源':'介紹工具與學習資源。例如：數位帳戶、理財書籍。','個人故事':'以真實經歷為主軸。例如：第一次存錢。','日常生活':'分享當下生活與心情。例如：下班的小確幸。','其他':'無法歸入上述主題的內容。','暖場預告':'為接下來的內容預熱。例如：你有沒有存不到錢的經驗？','知識分享':'讓粉絲學到觀念或方法。例如：解釋儲蓄率公式。','粉絲互動':'蒐集粉絲想法或經驗。例如：你每月存多少錢？','貼文導流':'引導閱讀貼文或 Reels。例如：點進去看三個存錢方法。','生活連結':'讓粉絲更認識你。例如：分享下班的小確幸。','後續延伸':'延續已發布內容。例如：公布昨天的投票結果。'};
function guideSelect(name,items,value){let list=[...items];if(value&&!list.includes(value))list.push(value);return `<select name="${name}" data-guide>${options(list,value)}</select><div class="small muted guide">${esc(GUIDES[value]||'舊分類或尚未選擇；可保留原值。')}</div>`}
function slideStatus(p,i){return p.slides[i].status|| (hasRecord(rec(p.id,i))||p.status==='published'?'published':'planned')}
function pending(p,i){return slideStatus(p,i)==='published'&&p.date<dateNow()&&['reach','views','replies'].some(k=>validNum(rec(p.id,i)[k])===null)}
function pendingHome(){let list=db.plans.filter(p=>p.slides.some((_,i)=>pending(p,i)));return `<section class="panel section"><h2>待回填成效</h2><p class="small muted">已發布且日期早於今天；觸及、觀看、回覆尚未填齊。確認零次請填 0。</p>${list.map(p=>`<div class="item"><div><b>${esc(p.date)}｜${esc(p.topic)}</b><div class="small muted">${p.slides.filter((_,i)=>pending(p,i)).length} 則待回填</div></div><button class="btn" data-pending="${esc(p.id)}">回填</button></div>`).join('')||'<div class="empty">目前沒有待回填項目。</div>'}</section>`}

const blank=()=>({schemaVersion:1,plans:[],records:{},updatedAt:null});
let db=load(),page='home',month=localMonth(),selectedId=null,recordSlide=0,editingId=null;
function localMonth(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.schemaVersion===1&&Array.isArray(s.plans)&&s.records&&typeof s.records==='object')return s}catch(e){}return blank()}
function save(){db.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('無法儲存：瀏覽器儲存空間不足或已停用。請先下載備份。');return false}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function $ (id){return document.getElementById(id)}
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2500)}
function dateNow(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function plans(){return db.plans.filter(p=>p.date.startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date))}
function rec(id,i){return db.records[`${id}:${i}`]||{}}
function num(v){return v===''||v===null||v===undefined?null:Number(v)}
function validNum(v){return Number.isFinite(num(v))?num(v):null}
function hasRecord(r){return ['reach','views','replies','sticker','link','profile','shares','back','forward','exits'].some(k=>validNum(r[k])!==null)}
function metrics(){let rows=[];for(const p of plans())for(let i=0;i<p.slides.length;i++){const r=rec(p.id,i);if(slideStatus(p,i)!=='cancelled'&&hasRecord(r))rows.push({p,i,r})}return rows}
function sum(rows,key){return rows.reduce((s,x)=>s+(validNum(x.r[key])??0),0)}
function avg(rows,key){let v=rows.map(x=>validNum(x.r[key])).filter(x=>x!==null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function fmt(v,d=0){return v===null||v===undefined?'—':Number(v).toLocaleString('zh-TW',{maximumFractionDigits:d,minimumFractionDigits:d})}
function rate(a,b){return b>0?a/b*100:null}
function options(items,value){return items.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')}
function setPage(p){page=p;editingId=null;render();window.scrollTo({top:0,behavior:'instant'})}
function render(){const names={home:['首頁總覽','讓每一則限動，都有清楚的方向。'],plan:['限動企劃','規劃主題、文案與互動方式。'],record:['成效紀錄','在手機上快速紀錄每則限動的洞察數據。'],analysis:['數據分析','從真實紀錄中看見內容趨勢。'],report:['月度報告','整理成果，準備下一個月的優化方向。']};$('heading').textContent=names[page][0];$('subtitle').textContent=names[page][1];$('month').value=month;for(let target of [$('nav'),$('mobileNav')])target.innerHTML=PAGES.map(([id,ico,label])=>`<button class="${id===page?'active':''}" data-page="${id}"><b>${ico}</b><span>${label}</span></button>`).join('');$('view').innerHTML=({home:homeView,plan:planView,record:recordView,analysis:analysisView,report:reportView})[page]();bind()}
function homeView(){const ps=plans(),rows=metrics(),today=ps.filter(p=>p.date===dateNow()),published=ps.filter(p=>p.slides.some((_,i)=>slideStatus(p,i)==='published')).length;return `<div class="grid four"><div class="panel"><div class="muted">本月企劃天數</div><div class="metric stat">${ps.length}</div><div class="small muted">已安排發布日期</div></div><div class="panel"><div class="muted">已發布天數</div><div class="metric stat">${published}</div><div class="small muted">完成率 ${ps.length?fmt(published/ps.length*100,0):'0'}%</div></div><div class="panel"><div class="muted">已記錄限動</div><div class="metric stat">${rows.length}</div><div class="small muted">已規劃 ${ps.reduce((n,p)=>n+p.slides.length,0)} 則</div></div><div class="panel"><div class="muted">平均觸及</div><div class="metric stat">${fmt(avg(rows,'reach'),1)}</div><div class="small muted">僅計入有填觸及的限動</div></div></div><div class="grid two section"><section class="panel"><h2>今天要發的限動</h2>${today.length?today.map(p=>`<div class="item"><div><b>${esc(p.topic)}</b><div class="small muted">${esc(p.time||'未設定時間')} · ${esc(p.category)}</div></div><button class="btn" data-open="${esc(p.id)}">查看企劃</button></div>`).join(''):'<div class="empty">今天沒有安排限動。<br><span class="small">到「限動企劃」新增發布日期。</span></div>'}</section><section class="panel"><h2>待發布事項</h2>${ps.filter(p=>p.slides.some((_,i)=>slideStatus(p,i)==='planned')).slice(0,5).map(p=>`<div class="item"><div><b>${esc(p.date)}｜${esc(p.topic)}</b><div class="small muted">${'尚有待發布限動'}</div></div><button class="btn" data-record="${esc(p.id)}">處理</button></div>`).join('')||'<div class="empty">本月沒有待處理項目。</div>'}</section></div><section class="panel section"><h2>本月成效概覽</h2>${rows.length?`<div class="grid three"><div><div class="muted">觀看次數合計</div><div class="metric">${fmt(sum(rows,'views'))}</div></div><div><div class="muted">回覆次數合計</div><div class="metric">${fmt(sum(rows,'replies'))}</div></div><div><div class="muted">貼紙互動次數合計</div><div class="metric">${fmt(sum(rows,'sticker'))}</div></div></div><button class="btn" data-page="analysis">查看完整分析 →</button>`:'<div class="empty">尚無成效數據。發布後在「成效紀錄」輸入真實洞察即可自動更新。</div>'}</section>${pendingHome()}<p class="footnote">提醒：此網站資料只存在目前瀏覽器。手機與電腦不會自動同步，請定期下載 JSON 完整備份。</p>`}
function calView(){let [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate(),pmap=new Map(plans().map(p=>[p.date,p]));return `<div class="calendar">${['日','一','二','三','四','五','六'].map(d=>`<div class="calhead">${d}</div>`).join('')}${Array.from({length:first},()=>'<div></div>').join('')}${Array.from({length:days},(_,i)=>{let date=`${month}-${String(i+1).padStart(2,'0')}`,p=pmap.get(date);return `<button class="day ${p?'has':''} ${date===dateNow()?'today':''}" data-day="${date}"><b>${i+1}</b>${p?`<small>${esc(p.topic)}</small><small>${p.slides.every((_,i)=>slideStatus(p,i)==='cancelled')?'已取消':p.slides.some((_,i)=>slideStatus(p,i)==='published')?'✓ 已發布':'◦ 待發布'}</small>`:''}</button>`}).join('')}</div>`}
function planView(){let ps=plans();return `<div class="toolbar"><button class="btn primary" id="newPlan">＋ 新增限動企劃</button><button class="btn" id="importPlan">匯入企劃 JSON</button><button class="btn" id="exportPlan">匯出本月企劃 JSON</button></div><section class="panel section"><h2>${esc(month)} 發布行事曆</h2>${calView()}</section><section class="panel section"><h2>本月企劃清單</h2>${ps.length?ps.map(p=>`<div class="item"><div><b>${esc(p.date)}｜${esc(p.topic)}</b><div class="small muted">${esc(p.category)} · ${esc(p.time||'未設定時間')} · ${p.status==='published'?'已發布':'待發布'}</div></div><div class="toolbar"><button class="btn" data-open="${esc(p.id)}">編輯／查看</button><button class="btn danger" data-delete="${esc(p.id)}">刪除</button></div></div>`).join(''):'<div class="empty">目前沒有企劃。點選「新增限動企劃」，依需求安排限動。</div>'}</section><div id="editor"></div><p class="footnote">每個日期可自由安排 1 則以上限動，每則可有不同主題。企劃 JSON 匯入適合把 ChatGPT 提供的當月企劃一次放進網站；完整備份請到「月度報告」。</p>`}
const STICKER_TOOLS=['無互動工具','投票','問題箱','表情滑桿','測驗','連結','倒數計時','心情貼圖','其他'];
function stickerParts(value){let v=String(value||'').trim();if(!v||v==='無'||v==='無互動工具')return {tool:'無互動工具',detail:''};let match=STICKER_TOOLS.slice(1,-1).find(t=>v===t||v.startsWith(t+'：')||v.startsWith(t+':')||v.startsWith(t+'｜')||v.startsWith(t+' '));if(match)return {tool:match,detail:v.slice(match.length).replace(/^[：:｜\s]+/,'')};return {tool:'其他',detail:v}}
function stickerField(value,i){let parts=stickerParts(value);return `<div class="field section"><label>互動貼紙／工具</label><div class="sticker-choices">${STICKER_TOOLS.map(t=>`<label class="sticker-choice"><input type="radio" name="stickerTool${i}" value="${esc(t)}" ${parts.tool===t?'checked':''}><span>${esc(t)}</span></label>`).join('')}</div><div class="sticker-detail field" data-sticker-detail="${i}" ${parts.tool==='無互動工具'?'hidden':''}><label>${parts.tool==='其他'?'自訂工具或完整描述':'互動內容／選項（選填）'}</label><input name="stickerDetail${i}" value="${esc(parts.detail)}" placeholder="${parts.tool==='其他'?'例如：新增工具名稱':'例如：你有記帳習慣嗎？'}"></div><div class="sticker-help">點選工具即可；需要提問或補充選項時再輸入。原有文字會保留。</div></div>`}
function slideEditor(s,i){return `<div class="story" data-story-index="${i}"><div class="storytop"><span class="number">${String(i+1).padStart(2,'0')}</span><b>限動 ${i+1}</b><button type="button" class="btn danger" data-remove-slide="${i}">刪除此則</button></div><div class="field"><label>這則限動的主題（選填）</label><input name="title${i}" value="${esc(s.title||'')}" placeholder="例如：生活分享／貼文導流"></div><div class="field section"><label>內容分類</label><select name="category${i}" data-guide>${options([...TOPICS,...(s.category&&!TOPICS.includes(s.category)?[s.category]:[])],s.category||'其他')}</select><div class="small muted guide">${esc(GUIDES[s.category]||'舊分類可保留')}</div></div><div class="field section"><label>限動文案</label><div class="small muted">實際要發布在限動上的文字。</div><textarea name="copy${i}" placeholder="例如：你有沒有發現，月底總是存不到錢？">${esc(s.copy||'')}</textarea></div><div class="field section"><label>畫面構想（選填）</label><div class="small muted">簡單記錄背景、照片或排版方向即可。</div><textarea name="visual${i}" placeholder="例如：米灰背景＋文字＋投票貼紙" style="min-height:65px">${esc(s.visual||'')}</textarea></div>${stickerField(s.sticker,i)}<div class="field section"><label>限動目的</label>${guideSelect(`purpose${i}`,['',...PURPOSES],s.purpose||'')}<p class="small muted">以主要目的判斷，不以貼紙判斷。投票暖場選暖場預告；蒐集想法選粉絲互動。</p><label>目的備註（保留原文）</label><input name="goal${i}" value="${esc(s.goal||'')}" placeholder="暖場、知識、導流…"></div><div class="field section"><label>內容形式（選填）</label><select name="format${i}">${options(['',...FORMATS],s.format||'')}</select><p class="small muted">選主要呈現方式，不需上傳照片。</p></div><div class="field section"><label>發布狀態</label><select name="slideStatus${i}">${options(['','planned','published','cancelled'],s.status||'').replace('><\/option>','>沿用當日狀態<\/option>').replace('>planned<','>待發布<').replace('>published<','>已發布<').replace('>cancelled<','>取消<')}</select></div></div>`}
function bindStickerChoices(){document.querySelectorAll('[data-story-index]').forEach(story=>{let i=story.dataset.storyIndex;story.querySelectorAll(`input[name="stickerTool${i}"]`).forEach(r=>r.addEventListener('change',()=>{let tool=story.querySelector(`input[name="stickerTool${i}"]:checked`)?.value||'無互動工具';let detail=story.querySelector(`[data-sticker-detail="${i}"]`);detail.hidden=tool==='無互動工具';detail.querySelector('label').textContent=tool==='其他'?'自訂工具或完整描述':'互動內容／選項（選填）';detail.querySelector('input').placeholder=tool==='其他'?'例如：新增工具名稱':'例如：你有記帳習慣嗎？';}));})}
function collectSticker(f,i){let tool=String(f.get(`stickerTool${i}`)||'無互動工具'),detail=String(f.get(`stickerDetail${i}`)||'').trim();if(tool==='無互動工具')return '無';if(tool==='其他')return detail||'其他';return detail?`${tool}：${detail}`:tool}

function editor(p){return `<section class="panel section" id="editSection"><div class="toolbar" style="justify-content:space-between"><h2>${p.id?'編輯限動企劃':'新增限動企劃'}</h2><button class="btn" id="closeEdit">關閉</button></div><form id="planForm"><div class="formgrid"><div class="field"><label>發布日期 *</label><input name="date" type="date" required value="${esc(p.date||`${month}-01`)}"></div><div class="field"><label>發布時間</label><input name="time" type="time" value="${esc(p.time||'19:00')}"></div><div class="field"><label>當日主題 *</label><input name="topic" required maxlength="160" value="${esc(p.topic||'')}" placeholder="例如：今天的限動紀錄"></div><div class="field"><label>當日主要分類</label>${guideSelect("category",TOPICS,p.category||TOPICS[0])}</div><div class="field"><label>發布狀態</label><select name="status">${options(['planned','published'],p.status||'planned').replace('>planned<','>待發布<').replace('>published<','>已發布<')}</select></div><div class="field"><label>實際發布時間（選填）</label><input name="publishedAt" type="datetime-local" value="${esc(p.publishedAt||'')}"></div></div><div id="slideEditors" class="grid three section">${p.slides.map((x,i)=>slideEditor(x,i)).join('')}</div><div class="toolbar section"><button type="button" class="btn" id="addSlide">＋ 新增一則限動</button><button type="button" class="btn" id="reuseSlide">＋ 沿用上一則設定</button><button type="submit" class="btn primary">儲存企劃</button><button type="button" class="btn" id="copyPlan">複製全部文案</button></div><p class="small muted">每則限動可有獨立主題及分類；刪除限動會連同該則已記錄的成效刪除，請先下載完整備份。</p></form></section>`}
function recordView(){let ps=plans();if(!ps.length)return `<div class="empty">請先到「限動企劃」新增發布日期，才能輸入對應成效。<div class="section"><button class="btn primary" data-page="plan">前往限動企劃</button></div></div>`;if(!ps.some(p=>p.id===selectedId))selectedId=ps[0].id;let p=ps.find(p=>p.id===selectedId);if(recordSlide>=p.slides.length)recordSlide=0;let r=rec(p.id,recordSlide);return `<section class="panel"><div class="formgrid"><div class="field"><label>選擇發布日期與主題</label><select id="recordPlan">${ps.map(x=>`<option value="${esc(x.id)}" ${x.id===p.id?'selected':''}>${esc(x.date)}｜${esc(x.topic)}</option>`).join('')}</select></div><div class="field"><label>資料紀錄狀態</label><div class="notice">${p.slides.filter((_,i)=>hasRecord(rec(p.id,i))).length}／${p.slides.length} 則已有數據</div></div></div><div class="tabrow">${p.slides.map((_,i)=>`<button class="btn ${i===recordSlide?'selected':''}" data-slide="${i}">限動 0${i+1} ${hasRecord(rec(p.id,i))?'✓':''}</button>`).join('')}</div><div class="story"><div class="storytop"><span class="number">0${recordSlide+1}</span><span class="pill">${esc(p.slides?.[recordSlide]?.category||p.category)}</span></div><div style="line-height:1.8;white-space:pre-wrap">${esc(p.slides?.[recordSlide]?.copy||'尚未填寫文案')}</div><div class="small muted section">主題：${esc(p.slides?.[recordSlide]?.title||p.topic)} · 貼紙：${esc(p.slides?.[recordSlide]?.sticker||'未設定')}</div></div><form id="recordForm" class="section">${slideStatus(p,recordSlide)==='cancelled'?'<p class="notice">此則已取消，數據不納入分析。</p>':''}<p class="notice">確認沒有互動請填 0；未取得請留白。沒有使用貼紙或連結時不必填寫。</p><div class="formgrid">${[['reach','觸及帳號數'],['views','觀看次數'],['replies','回覆次數'],['sticker','貼紙互動次數']].map(([k,label])=>`<div class="field"><label>${label}</label><input name="${k}" type="number" min="0" step="1" inputmode="numeric" placeholder="未取得可留空" value="${esc(r[k]??'')}"></div>`).join('')}</div><details class="advanced-record" ${['link','shares'].some(k=>r[k]!==null&&r[k]!==undefined&&r[k]!=='')?'open':''}><summary>其他數據（有使用連結或想追蹤分享時才填）</summary><p class="small muted">沒有放連結貼紙，就不用填連結點擊；未取得請留空。</p><div class="formgrid">${[['link','連結點擊次數'],['shares','分享次數']].map(([k,label])=>`<div class="field"><label>${label}</label><input name="${k}" type="number" min="0" step="1" inputmode="numeric" placeholder="未取得可留空" value="${esc(r[k]??'')}"></div>`).join('')}</div></details><div class="formgrid section"><div class="field span2"><label>洞察擷取時間（建議發布約 24 小時後）</label><input type="datetime-local" name="measuredAt" value="${esc(r.measuredAt||'')}"></div><div class="field span2"><label>實際內容／備註（選填）</label><textarea name="note" placeholder="如：實際文案調整、貼紙回應、特殊情況">${esc(r.note||'')}</textarea></div></div><div class="toolbar section"><button type="submit" class="btn primary">儲存限動 0${recordSlide+1} 數據</button><button type="button" class="btn danger" id="clearRecord">清除此則數據</button></div></form></section><p class="footnote">平常只需填四項主要數據。沒有使用貼紙或連結時可留空；留空代表未取得或不適用，填 0 才代表實際為零。觀看次數與觸及帳號數不同。輸入後請按「儲存」。</p>`}
function bars(groups){let max=Math.max(1,...groups.map(x=>x.value||0));return groups.length?groups.map(g=>`<div class="barrow"><span>${esc(g.name)}${g.n!==undefined?` <small class="muted">(${g.n} 則)</small>`:''}</span><div class="track"><div class="fill" style="width:${Math.max(0,(g.value||0)/max*100)}%"></div></div><b class="stat">${fmt(g.value,1)}</b></div>`).join(''):'<div class="empty">尚無足夠資料</div>'}
let dailyAll=false;
function chart(rows){const ordered=[...rows].reverse(),shown=dailyAll?ordered:ordered.slice(0,7),max=Math.max(1,...rows.map(x=>x.value));return `<div class="daily-list"><div class="toolbar"><button class="btn ${!dailyAll?'selected':''}" data-daily="recent">最近 7 個發布日</button><button class="btn ${dailyAll?'selected':''}" data-daily="all">全月</button></div>${shown.map(x=>`<div class="daily-row"><div class="daily-label"><span>${esc(x.name)} <small class="muted">${x.n} 則</small></span><b>${fmt(x.value,1)}</b></div><div class="track"><div class="fill" style="width:${x.value/max*100}%"></div></div></div>`).join('')}<p class="small muted">由新到舊排列；長條以本月最高每日平均觸及為基準。</p></div>`}
function medianReach(rows){let a=rows.map(x=>validNum(x.r.reach)).filter(x=>x!==null).sort((a,b)=>a-b);return a.length?(a[Math.floor((a.length-1)/2)]+a[Math.floor(a.length/2)])/2:null}
function analysisView(){let rows=metrics(),reachRows=rows.filter(x=>validNum(x.r.reach)!==null),stickerRows=rows.filter(x=>validNum(x.r.sticker)!==null&&validNum(x.r.reach)>0);if(!rows.length)return '<div class="empty">還沒有任何實際成效紀錄。請先到「成效紀錄」輸入數據，分析圖表會自動出現。</div>';let bycat=CATS.map(c=>({name:c,rr:reachRows.filter(x=>(x.p.slides[x.i]?.category||x.p.category)===c)})).filter(x=>x.rr.length).map(x=>({name:x.name,value:avg(x.rr,'reach'),n:x.rr.length}));let byslide=Array.from({length:Math.max(0,...plans().map(p=>p.slides.length))},(_,i)=>({name:`限動 0${i+1}`,rr:reachRows.filter(x=>x.i===i)})).map(x=>({name:x.name,value:avg(x.rr,'reach'),n:x.rr.length}));let days=[...new Set(reachRows.map(x=>x.p.date))].sort().map(d=>({name:d.slice(5).replace('-','/'),rr:reachRows.filter(x=>x.p.date===d)})).map(x=>({name:x.name,value:avg(x.rr,'reach'),n:x.rr.length}));let top=[...reachRows].sort((a,b)=>b.r.reach-a.r.reach).slice(0,5);return `<div class="grid four"><div class="panel"><div class="muted">已記錄則數</div><div class="metric">${rows.length}</div></div><div class="panel"><div class="muted">平均觸及</div><div class="metric">${fmt(avg(rows,'reach'),1)}</div></div><div class="panel"><div class="muted">回覆次數合計</div><div class="metric">${fmt(sum(rows,'replies'))}</div></div><div class="panel"><div class="muted">貼紙互動次數合計</div><div class="metric">${fmt(sum(rows,'sticker'))}</div></div></div><div class="grid two section"><section class="panel"><h2>每日平均觸及</h2>${days.length?chart(days):'<div class="empty">尚無觸及數據</div>'}<div class="small muted">依限動發布日期分組；每日平均僅計入有填觸及的限動，未記錄的日期不視為 0。</div></section><section class="panel"><h2>各主題平均觸及</h2>${bars(bycat)}<div class="small muted">${bycat.map(x=>`${x.name} ${x.n} 則`).join(' · ')}</div></section><section class="panel"><h2>各限動目的平均觸及</h2>${bars([...PURPOSES,'未分類'].map(name=>{let rr=reachRows.filter(x=>(x.p.slides[x.i].purpose||'未分類')===name);return {name,value:avg(rr,'reach'),n:rr.length}}).filter(x=>x.n))}<p class="small muted">舊資料未設定目的分類時列為未分類。</p></section><section class="panel"><h2>各限動位置比較</h2>${bars(byslide.filter(x=>x.value!==null))}<div class="small muted">不同位置的觸及差異不一定由內容順序造成。</div></section><section class="panel"><h2>互動指標</h2><div class="item"><span>回覆次數／觸及帳號數</span><b>${fmt(rate(sum(reachRows.filter(x=>validNum(x.r.replies)!==null),'replies'),sum(reachRows.filter(x=>validNum(x.r.replies)!==null),'reach')),2)}%</b></div><div class="item"><span>貼紙互動次數／觸及帳號數</span><b>${fmt(rate(sum(stickerRows,'sticker'),sum(stickerRows,'reach')),2)}%</b></div><div class="small muted section">這些是「互動次數比率」，不代表不重複互動人數比例。只納入分子與分母都有填寫的紀錄。</div></section></div><section class="panel section"><h2>觸及最高的 5 則限動</h2>${top.map((x,i)=>`<div class="item"><div><b>${i+1}. ${esc(x.p.date)}｜${esc(x.p.topic)}（0${x.i+1}）</b><div class="small muted">${esc(x.p.slides[x.i]?.category||x.p.category)}</div></div><b>${fmt(x.r.reach)}</b></div>`).join('')}</section><div class="notice section">分析提醒：樣本數較少時，排名和平均值可能受個別限動影響。建議搭配內容、發布時間與觀察時間一起解讀，避免直接推論因果。</div>`}

$('importFile').addEventListener('change',async e=>{let file=e.target.files?.[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(importMode==='backup'){if(obj.schemaVersion!==1||!Array.isArray(obj.plans)||!obj.plans.every(validatePlan)||!obj.records||typeof obj.records!=='object'||Array.isArray(obj.records))throw Error('不是相容的完整備份格式');if(!confirm('匯入完整備份將覆蓋目前所有資料，確定繼續？'))return;db={schemaVersion:1,plans:obj.plans,records:obj.records,updatedAt:obj.updatedAt||null};if(save()){render();toast('完整備份已還原')}}else{let list=Array.isArray(obj)?obj:obj.plans;if(!Array.isArray(list)||!list.every(validatePlan))throw Error('企劃 JSON 格式不正確');let count=0;for(let p of list){if(db.plans.some(x=>x.date===p.date))continue;let id='p_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);db.plans.push({id,date:p.date,time:p.time||'19:00',topic:p.topic,category:CATS.includes(p.category)?p.category:CATS[0],status:'planned',publishedAt:'',slides:p.slides.map(s=>({...s,status:'planned',title:String(s.title||''),category:CATS.includes(s.category)?s.category:(CATS.includes(p.category)?p.category:'其他'),copy:String(s.copy||''),visual:String(s.visual||''),sticker:String(s.sticker||''),goal:String(s.goal||'')}))});count++}save();render();toast(`成功匯入 ${count} 個企劃（同日期略過）`)}}catch(err){alert('匯入失敗：'+err.message)}});
$('month').addEventListener('change',e=>{month=e.target.value;selectedId=null;render()});$('backupTop').onclick=backup;render();
