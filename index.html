<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8f6"><title>限動經營工作台</title><style>
:root{--bg:#f7f8f6;--panel:#fff;--ink:#303d3b;--muted:#72827f;--sage:#667f74;--sage2:#dce6df;--blue:#839baa;--blue2:#dde7ed;--line:#e3e9e5;--warm:#f1ede6;--shadow:0 8px 30px #263c3110}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans TC','Microsoft JhengHei',sans-serif;font-size:14px}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.app{display:flex;min-height:100vh}.side{width:235px;flex:none;background:#f0f3ef;border-right:1px solid var(--line);padding:30px 18px;position:sticky;top:0;height:100vh}.brand{font-family:Georgia,'Noto Serif TC',serif;font-size:23px;font-weight:700;letter-spacing:2px;margin:6px 9px 8px}.brand-sub{font-size:11px;color:var(--muted);margin:0 9px 35px;letter-spacing:1px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;text-align:left;padding:13px 15px;border-radius:12px;color:var(--ink);display:flex;align-items:center;gap:12px}.nav button.active{background:#dce6df;font-weight:700}.nav button:hover{background:#e2eae4}.main{width:100%;min-width:0;padding:34px 38px 80px;max-width:1510px;margin:auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:25px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--sage);font-weight:700}h1{font-family:Georgia,'Noto Serif TC',serif;font-size:32px;margin:9px 0 8px;letter-spacing:1px}h2{font-size:18px;margin:0 0 16px}h3{font-size:15px;margin:0 0 12px}.muted{color:var(--muted)}.small{font-size:12px}.pill{display:inline-flex;background:var(--sage2);padding:7px 12px;border-radius:30px;color:#425f53;font-size:12px}.panel{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:22px;min-width:0}.grid{display:grid;gap:17px}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.metric{font-size:28px;font-weight:700;letter-spacing:-1px;margin:8px 0}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;border-radius:10px;font-weight:600}.btn:hover{border-color:var(--sage)}.btn.primary{background:#465f59;color:white;border-color:#465f59}.btn.danger{color:#b1514c}.btn.ghost{background:transparent}.section{margin-top:20px}.field{display:grid;gap:6px;min-width:0}.field label{font-size:12px;font-weight:700;color:#556862}.field input,.field textarea,.field select,.control{width:100%;padding:11px 12px;border:1px solid #dce5df;background:#fff;border-radius:10px;color:var(--ink);outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--sage);box-shadow:0 0 0 3px #a8bdb130}.field textarea{min-height:100px;resize:vertical;line-height:1.7}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.span2{grid-column:1/-1}.story{background:#f7f9f7;border:1px solid var(--line);border-radius:14px;padding:17px}.storytop{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:13px}.number{display:inline-grid;place-items:center;background:#465f59;color:#fff;border-radius:100%;height:32px;width:32px;font-weight:700}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.calhead{text-align:center;color:var(--muted);padding:9px 0;font-size:12px}.day{min-height:86px;background:#fafcfb;border:1px solid var(--line);border-radius:10px;text-align:left;padding:10px;display:flex;flex-direction:column;gap:7px;color:var(--ink)}.day.has{background:#eaf0ec;border-color:#c6d8cd}.day.today{outline:2px solid var(--blue)}.day small{font-size:11px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.day:hover{border-color:var(--sage)}.item{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.item:last-child{border:0}.barrow{display:grid;grid-template-columns:115px 1fr 55px;gap:10px;align-items:center;margin:14px 0}.track{background:#edf1ee;border-radius:30px;height:11px;overflow:hidden}.fill{height:100%;background:#839baa;border-radius:30px}.notice{background:#f0f4f1;border-left:3px solid #839baa;padding:13px 15px;border-radius:8px;color:#53655e;line-height:1.7}.empty{color:var(--muted);text-align:center;padding:32px 14px;border:1px dashed #cbd8d1;border-radius:14px}.chart{width:100%;height:230px}.chart text{fill:#758580;font-size:11px}.reporttext{line-height:1.9;white-space:pre-wrap}.mobile-nav{display:none}.hidden{display:none!important}.tabrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.tabrow button.selected{background:#465f59;color:white}.toast{position:fixed;right:22px;bottom:24px;background:#304941;color:white;padding:13px 20px;border-radius:12px;box-shadow:var(--shadow);z-index:99}.link{color:#486c80;text-decoration:underline;cursor:pointer}.stat{font-variant-numeric:tabular-nums}.dangertext{color:#ae514d}.footnote{margin-top:25px;font-size:12px;color:var(--muted);line-height:1.7}@media(max-width:1000px){.side{width:200px}.main{padding:24px}.four{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:1fr}}@media(max-width:700px){.side{display:none}.main{padding:21px 15px 95px}.top{flex-direction:column;gap:12px}h1{font-size:26px}.two,.four,.three,.formgrid{grid-template-columns:1fr}.panel{padding:17px}.calendar{gap:3px}.day{min-height:62px;padding:6px 4px;border-radius:7px}.day small{font-size:9px}.calhead{font-size:11px}.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:50;padding:6px 4px max(8px,env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:transparent;font-size:10px;color:#65766f;padding:7px 0;display:grid;gap:5px;justify-items:center}.mobile-nav button.active{color:#36584a;font-weight:800}.mobile-nav b{font-size:18px}.barrow{grid-template-columns:76px 1fr 42px;font-size:12px}.span2{grid-column:auto}.item{align-items:flex-start}.metric{font-size:25px}}@media print{.side,.mobile-nav,.toolbar,.btn,.no-print{display:none!important}.main{padding:0}.panel{box-shadow:none;break-inside:avoid}body{background:white}}

/* Mobile layout refinement: preserve data and existing visual identity. */
html,body{max-width:100%;overflow-x:clip}
.main,.panel,.story,.item,.item>div,.toolbar,.field{min-width:0}
.item b,.story,.notice,.reporttext,.empty{overflow-wrap:anywhere}
.item .toolbar{flex-shrink:0}
.field input,.field select,.field textarea{max-width:100%;min-width:0}
.advanced-record{border:1px solid var(--line);border-radius:12px;margin-top:16px;padding:0 14px 14px;background:#fafcfb}
.advanced-record summary{cursor:pointer;padding:14px 0;font-weight:700;color:var(--sage);list-style-position:inside}
.advanced-record[open] summary{margin-bottom:10px;border-bottom:1px solid var(--line)}
@media(max-width:700px){
 .main{width:100%;max-width:100vw;padding:18px 13px calc(108px + env(safe-area-inset-bottom))}
 .top .toolbar{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto}
 .top .toolbar #month{width:100%!important;min-width:0}
 .top .toolbar .btn{white-space:nowrap}
 .panel{padding:16px 14px;border-radius:15px}
 .item{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:15px 0}
 .item>.toolbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);width:100%;gap:8px}
 .item>.toolbar .btn{width:100%;padding:10px 6px;white-space:normal;overflow-wrap:anywhere}
 .toolbar{gap:8px}
 .toolbar>.btn{max-width:100%;white-space:normal}
 .storytop{flex-wrap:wrap}
 .day{min-width:0;overflow:hidden}
 .day b{font-size:12px}
 .day small{overflow-wrap:anywhere;word-break:break-word}
 .mobile-nav{grid-template-columns:repeat(5,minmax(0,1fr));padding-left:max(4px,env(safe-area-inset-left));padding-right:max(4px,env(safe-area-inset-right))}
 .mobile-nav button{min-width:0;font-size:10px;line-height:1.3}
 .mobile-nav button span{overflow-wrap:anywhere}
 .barrow{grid-template-columns:70px minmax(0,1fr) 42px}
}
@media(max-width:370px){.main{padding-left:10px;padding-right:10px}.panel{padding:13px 11px}.calendar{gap:2px}.day{padding:5px 3px}.mobile-nav button{font-size:9px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">限動經營工作台</div><div class="brand-sub">內容企劃 · 成效紀錄 · 數據分析</div><nav id="nav" class="nav"></nav><div class="footnote">資料僅儲存於目前瀏覽器。<br>請定期下載完整備份。</div></aside><main class="main"><header class="top"><div><div class="eyebrow">STORY WORKSPACE</div><h1 id="heading">首頁總覽</h1><div id="subtitle" class="muted">讓每一則限動，都有清楚的方向。</div></div><div class="toolbar"><input id="month" type="month" class="control" style="width:170px" aria-label="選擇月份"><button class="btn" id="backupTop">下載備份</button></div></header><div id="view"></div></main></div><nav id="mobileNav" class="mobile-nav"></nav><div id="toast" class="toast hidden" role="status"></div><input id="importFile" type="file" accept="application/json,.json" hidden><script>
'use strict';
const KEY='story-workspace-v1', PAGES=[['home','⌂','首頁總覽'],['plan','▣','限動企劃'],['record','✎','成效紀錄'],['analysis','▥','數據分析'],['report','▤','月度報告']];
const CATS=['理財知識','個人故事','日常生活','粉絲互動','貼文導流','其他'];
const blank=()=>({schemaVersion:1,plans:[],records:{},updatedAt:null});
let db=load(),page='home',month=localMonth(),selectedId=null,recordSlide=0,editingId=null;
function localMonth(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.schemaVersion===1&&Array.isArray(s.plans)&&s.records&&typeof s.records==='object')return s}catch(e){}return blank()}
function save(){db.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('無法儲存：瀏覽器儲存空間不足或已停用。請先下載備份。');return false}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function $ (id){return document.getElementById(id)}
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2500)}
function dateNow(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function plans(){return db.plans.filter(p=>p.date.startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date))}
function rec(id,i){return db.records[`${id}:${i}`]||{}}
function num(v){return v===''||v===null||v===undefined?null:Number(v)}
function validNum(v){return Number.isFinite(num(v))?num(v):null}
function hasRecord(r){return ['reach','views','replies','sticker','link','profile','shares','back','forward','exits'].some(k=>validNum(r[k])!==null)}
function metrics(){let rows=[];for(const p of plans())for(let i=0;i<p.slides.length;i++){const r=rec(p.id,i);if(hasRecord(r))rows.push({p,i,r})}return rows}
function sum(rows,key){return rows.reduce((s,x)=>s+(validNum(x.r[key])??0),0)}
function avg(rows,key){let v=rows.map(x=>validNum(x.r[key])).filter(x=>x!==null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function fmt(v,d=0){return v===null||v===undefined?'—':Number(v).toLocaleString('zh-TW',{maximumFractionDigits:d,minimumFractionDigits:d})}
function rate(a,b){return b>0?a/b*100:null}
function options(items,value){return items.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')}
function setPage(p){page=p;editingId=null;render();window.scrollTo({top:0,behavior:'instant'})}
function render(){const names={home:['首頁總覽','讓每一則限動，都有清楚的方向。'],plan:['限動企劃','規劃主題、文案與互動方式。'],record:['成效紀錄','在手機上快速紀錄每則限動的洞察數據。'],analysis:['數據分析','從真實紀錄中看見內容趨勢。'],report:['月度報告','整理成果，準備下一個月的優化方向。']};$('heading').textContent=names[page][0];$('subtitle').textContent=names[page][1];$('month').value=month;for(let target of [$('nav'),$('mobileNav')])target.innerHTML=PAGES.map(([id,ico,label])=>`<button class="${id===page?'active':''}" data-page="${id}"><b>${ico}</b><span>${label}</span></button>`).join('');$('view').innerHTML=({home:homeView,plan:planView,record:recordView,analysis:analysisView,report:reportView})[page]();bind()}
function homeView(){const ps=plans(),rows=metrics(),today=ps.filter(p=>p.date===dateNow()),published=ps.filter(p=>p.status==='published').length;return `<div class="grid four"><div class="panel"><div class="muted">本月企劃天數</div><div class="metric stat">${ps.length}</div><div class="small muted">已安排發布日期</div></div><div class="panel"><div class="muted">已發布天數</div><div class="metric stat">${published}</div><div class="small muted">完成率 ${ps.length?fmt(published/ps.length*100,0):'0'}%</div></div><div class="panel"><div class="muted">已記錄限動</div><div class="metric stat">${rows.length}</div><div class="small muted">已規劃 ${ps.reduce((n,p)=>n+p.slides.length,0)} 則</div></div><div class="panel"><div class="muted">平均觸及</div><div class="metric stat">${fmt(avg(rows,'reach'),1)}</div><div class="small muted">僅計入有填觸及的限動</div></div></div><div class="grid two section"><section class="panel"><h2>今天要發的限動</h2>${today.length?today.map(p=>`<div class="item"><div><b>${esc(p.topic)}</b><div class="small muted">${esc(p.time||'未設定時間')} · ${esc(p.category)}</div></div><button class="btn" data-open="${esc(p.id)}">查看企劃</button></div>`).join(''):'<div class="empty">今天沒有安排限動。<br><span class="small">到「限動企劃」新增發布日期。</span></div>'}</section><section class="panel"><h2>待完成事項</h2>${ps.filter(p=>p.status!=='published'||p.slides.some((_,i)=>!hasRecord(rec(p.id,i)))).slice(0,5).map(p=>`<div class="item"><div><b>${esc(p.date)}｜${esc(p.topic)}</b><div class="small muted">${p.status==='published'?'待補齊成效紀錄':'尚未標記已發布'}</div></div><button class="btn" data-record="${esc(p.id)}">處理</button></div>`).join('')||'<div class="empty">本月沒有待處理項目。</div>'}</section></div><section class="panel section"><h2>本月成效概覽</h2>${rows.length?`<div class="grid three"><div><div class="muted">觀看次數合計</div><div class="metric">${fmt(sum(rows,'views'))}</div></div><div><div class="muted">回覆次數合計</div><div class="metric">${fmt(sum(rows,'replies'))}</div></div><div><div class="muted">貼紙互動次數合計</div><div class="metric">${fmt(sum(rows,'sticker'))}</div></div></div><button class="btn" data-page="analysis">查看完整分析 →</button>`:'<div class="empty">尚無成效數據。發布後在「成效紀錄」輸入真實洞察即可自動更新。</div>'}</section><p class="footnote">提醒：此網站資料只存在目前瀏覽器。手機與電腦不會自動同步，請定期下載 JSON 完整備份。</p>`}
function calView(){let [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate(),pmap=new Map(plans().map(p=>[p.date,p]));return `<div class="calendar">${['日','一','二','三','四','五','六'].map(d=>`<div class="calhead">${d}</div>`).join('')}${Array.from({length:first},()=>'<div></div>').join('')}${Array.from({length:days},(_,i)=>{let date=`${month}-${String(i+1).padStart(2,'0')}`,p=pmap.get(date);return `<button class="day ${p?'has':''} ${date===dateNow()?'today':''}" data-day="${date}"><b>${i+1}</b>${p?`<small>${esc(p.topic)}</small><small>${p.status==='published'?'✓ 已發布':'◦ 待發布'}</small>`:''}</button>`}).join('')}</div>`}
function planView(){let ps=plans();return `<div class="toolbar"><button class="btn primary" id="newPlan">＋ 新增限動企劃</button><button class="btn" id="importPlan">匯入企劃 JSON</button><button class="btn" id="exportPlan">匯出本月企劃 JSON</button></div><section class="panel section"><h2>${esc(month)} 發布行事曆</h2>${calView()}</section><section class="panel section"><h2>本月企劃清單</h2>${ps.length?ps.map(p=>`<div class="item"><div><b>${esc(p.date)}｜${esc(p.topic)}</b><div class="small muted">${esc(p.category)} · ${esc(p.time||'未設定時間')} · ${p.status==='published'?'已發布':'待發布'}</div></div><div class="toolbar"><button class="btn" data-open="${esc(p.id)}">編輯／查看</button><button class="btn danger" data-delete="${esc(p.id)}">刪除</button></div></div>`).join(''):'<div class="empty">目前沒有企劃。點選「新增限動企劃」，依需求安排限動。</div>'}</section><div id="editor"></div><p class="footnote">每個日期可自由安排 1 則以上限動，每則可有不同主題。企劃 JSON 匯入適合把 ChatGPT 提供的當月企劃一次放進網站；完整備份請到「月度報告」。</p>`}
function slideEditor(s,i){return `<div class="story" data-story-index="${i}"><div class="storytop"><span class="number">${String(i+1).padStart(2,'0')}</span><b>限動 ${i+1}</b><button type="button" class="btn danger" data-remove-slide="${i}">刪除此則</button></div><div class="field"><label>這則限動的主題（選填）</label><input name="title${i}" value="${esc(s.title||'')}" placeholder="例如：生活分享／貼文導流"></div><div class="field section"><label>內容分類</label><select name="category${i}">${options(CATS,s.category||'其他')}</select></div><div class="field section"><label>完整限動文案</label><textarea name="copy${i}" placeholder="輸入實際要發布的文字">${esc(s.copy||'')}</textarea></div><div class="field section"><label>畫面建議</label><textarea name="visual${i}" style="min-height:65px">${esc(s.visual||'')}</textarea></div><div class="field section"><label>互動貼紙／工具</label><input name="sticker${i}" value="${esc(s.sticker||'')}" placeholder="投票、問答、連結…"></div><div class="field section"><label>發布目的</label><input name="goal${i}" value="${esc(s.goal||'')}" placeholder="暖場、知識、導流…"></div></div>`}
function editor(p){return `<section class="panel section" id="editSection"><div class="toolbar" style="justify-content:space-between"><h2>${p.id?'編輯限動企劃':'新增限動企劃'}</h2><button class="btn" id="closeEdit">關閉</button></div><form id="planForm"><div class="formgrid"><div class="field"><label>發布日期 *</label><input name="date" type="date" required value="${esc(p.date||`${month}-01`)}"></div><div class="field"><label>發布時間</label><input name="time" type="time" value="${esc(p.time||'19:00')}"></div><div class="field"><label>當日主題 *</label><input name="topic" required maxlength="160" value="${esc(p.topic||'')}" placeholder="例如：今天的限動紀錄"></div><div class="field"><label>當日主要分類</label><select name="category">${options(CATS,p.category||CATS[0])}</select></div><div class="field"><label>發布狀態</label><select name="status">${options(['planned','published'],p.status||'planned').replace('>planned<','>待發布<').replace('>published<','>已發布<')}</select></div><div class="field"><label>實際發布時間（選填）</label><input name="publishedAt" type="datetime-local" value="${esc(p.publishedAt||'')}"></div></div><div id="slideEditors" class="grid three section">${p.slides.map((x,i)=>slideEditor(x,i)).join('')}</div><div class="toolbar section"><button type="button" class="btn" id="addSlide">＋ 新增一則限動</button><button type="submit" class="btn primary">儲存企劃</button><button type="button" class="btn" id="copyPlan">複製全部文案</button></div><p class="small muted">每則限動可有獨立主題及分類；刪除限動會連同該則已記錄的成效刪除，請先下載完整備份。</p></form></section>`}
function recordView(){let ps=plans();if(!ps.length)return `<div class="empty">請先到「限動企劃」新增發布日期，才能輸入對應成效。<div class="section"><button class="btn primary" data-page="plan">前往限動企劃</button></div></div>`;if(!ps.some(p=>p.id===selectedId))selectedId=ps[0].id;let p=ps.find(p=>p.id===selectedId);if(recordSlide>=p.slides.length)recordSlide=0;let r=rec(p.id,recordSlide);return `<section class="panel"><div class="formgrid"><div class="field"><label>選擇發布日期與主題</label><select id="recordPlan">${ps.map(x=>`<option value="${esc(x.id)}" ${x.id===p.id?'selected':''}>${esc(x.date)}｜${esc(x.topic)}</option>`).join('')}</select></div><div class="field"><label>資料紀錄狀態</label><div class="notice">${p.slides.filter((_,i)=>hasRecord(rec(p.id,i))).length}／${p.slides.length} 則已有數據</div></div></div><div class="tabrow">${p.slides.map((_,i)=>`<button class="btn ${i===recordSlide?'selected':''}" data-slide="${i}">限動 0${i+1} ${hasRecord(rec(p.id,i))?'✓':''}</button>`).join('')}</div><div class="story"><div class="storytop"><span class="number">0${recordSlide+1}</span><span class="pill">${esc(p.slides?.[recordSlide]?.category||p.category)}</span></div><div style="line-height:1.8;white-space:pre-wrap">${esc(p.slides?.[recordSlide]?.copy||'尚未填寫文案')}</div><div class="small muted section">主題：${esc(p.slides?.[recordSlide]?.title||p.topic)} · 貼紙：${esc(p.slides?.[recordSlide]?.sticker||'未設定')}</div></div><form id="recordForm" class="section"><div class="formgrid">${[['reach','觸及帳號數'],['views','觀看次數'],['replies','回覆次數'],['sticker','貼紙互動次數']].map(([k,label])=>`<div class="field"><label>${label}</label><input name="${k}" type="number" min="0" step="1" inputmode="numeric" placeholder="未取得可留空" value="${esc(r[k]??'')}"></div>`).join('')}</div><details class="advanced-record" ${['link','shares'].some(k=>r[k]!==null&&r[k]!==undefined&&r[k]!=='')?'open':''}><summary>其他數據（有使用連結或想追蹤分享時才填）</summary><p class="small muted">沒有放連結貼紙，就不用填連結點擊；未取得請留空。</p><div class="formgrid">${[['link','連結點擊次數'],['shares','分享次數']].map(([k,label])=>`<div class="field"><label>${label}</label><input name="${k}" type="number" min="0" step="1" inputmode="numeric" placeholder="未取得可留空" value="${esc(r[k]??'')}"></div>`).join('')}</div></details><div class="formgrid section"><div class="field span2"><label>洞察擷取時間（建議發布約 24 小時後）</label><input type="datetime-local" name="measuredAt" value="${esc(r.measuredAt||'')}"></div><div class="field span2"><label>實際內容／備註（選填）</label><textarea name="note" placeholder="如：實際文案調整、貼紙回應、特殊情況">${esc(r.note||'')}</textarea></div></div><div class="toolbar section"><button type="submit" class="btn primary">儲存限動 0${recordSlide+1} 數據</button><button type="button" class="btn danger" id="clearRecord">清除此則數據</button></div></form></section><p class="footnote">平常只需填四項主要數據。沒有使用貼紙或連結時可留空；留空代表未取得或不適用，填 0 才代表實際為零。觀看次數與觸及帳號數不同。輸入後請按「儲存」。</p>`}
function bars(groups){let max=Math.max(1,...groups.map(x=>x.value||0));return groups.length?groups.map(g=>`<div class="barrow"><span>${esc(g.name)}</span><div class="track"><div class="fill" style="width:${Math.max(0,(g.value||0)/max*100)}%"></div></div><b class="stat">${fmt(g.value,1)}</b></div>`).join(''):'<div class="empty">尚無足夠資料</div>'}
function chart(rows){let points=rows.map((x,i)=>({x:36+(i*(590/Math.max(rows.length-1,1))),y:192-(x.value||0)/Math.max(1,...rows.map(a=>a.value||0))*150}));return `<svg class="chart" viewBox="0 0 660 235" preserveAspectRatio="none" role="img" aria-label="每週平均觸及折線圖"><line x1="36" y1="192" x2="635" y2="192" stroke="#dce6df"/><line x1="36" y1="116" x2="635" y2="116" stroke="#e8eeea"/><line x1="36" y1="42" x2="635" y2="42" stroke="#e8eeea"/>${points.length>1?`<polyline points="${points.map(p=>`${p.x},${p.y}`).join(' ')}" fill="none" stroke="#667f74" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:''}${points.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="5" fill="#667f74"><title>${esc(rows[i].name)}：${fmt(rows[i].value,1)}</title></circle><text x="${p.x}" y="217" text-anchor="middle">${esc(rows[i].name)}</text>`).join('')}</svg>`}
function analysisView(){let rows=metrics(),reachRows=rows.filter(x=>validNum(x.r.reach)!==null),stickerRows=rows.filter(x=>validNum(x.r.sticker)!==null&&validNum(x.r.reach)>0);if(!rows.length)return '<div class="empty">還沒有任何實際成效紀錄。請先到「成效紀錄」輸入數據，分析圖表會自動出現。</div>';let bycat=CATS.map(c=>({name:c,rr:reachRows.filter(x=>(x.p.slides[x.i]?.category||x.p.category)===c)})).filter(x=>x.rr.length).map(x=>({name:x.name,value:avg(x.rr,'reach'),n:x.rr.length}));let byslide=Array.from({length:Math.max(0,...plans().map(p=>p.slides.length))},(_,i)=>({name:`限動 0${i+1}`,rr:reachRows.filter(x=>x.i===i)})).map(x=>({name:x.name,value:avg(x.rr,'reach'),n:x.rr.length}));let weeks=[1,2,3,4,5,6].map(w=>({name:`第${w}週`,rr:reachRows.filter(x=>Math.ceil(Number(x.p.date.slice(8))/7)===w)})).filter(x=>x.rr.length).map(x=>({name:x.name,value:avg(x.rr,'reach')}));let top=[...reachRows].sort((a,b)=>b.r.reach-a.r.reach).slice(0,5);return `<div class="grid four"><div class="panel"><div class="muted">已記錄則數</div><div class="metric">${rows.length}</div></div><div class="panel"><div class="muted">平均觸及</div><div class="metric">${fmt(avg(rows,'reach'),1)}</div></div><div class="panel"><div class="muted">回覆次數合計</div><div class="metric">${fmt(sum(rows,'replies'))}</div></div><div class="panel"><div class="muted">貼紙互動次數合計</div><div class="metric">${fmt(sum(rows,'sticker'))}</div></div></div><div class="grid two section"><section class="panel"><h2>每週平均觸及</h2>${weeks.length?chart(weeks):'<div class="empty">尚無觸及數據</div>'}<div class="small muted">以日期每 7 天分組；僅比較有填觸及的限動。</div></section><section class="panel"><h2>各主題平均觸及</h2>${bars(bycat)}<div class="small muted">${bycat.map(x=>`${x.name} ${x.n} 則`).join(' · ')}</div></section><section class="panel"><h2>各限動位置比較</h2>${bars(byslide.filter(x=>x.value!==null))}<div class="small muted">不同位置的觸及差異不一定由內容順序造成。</div></section><section class="panel"><h2>互動指標</h2><div class="item"><span>回覆次數／觸及帳號數</span><b>${fmt(rate(sum(reachRows.filter(x=>validNum(x.r.replies)!==null),'replies'),sum(reachRows.filter(x=>validNum(x.r.replies)!==null),'reach')),2)}%</b></div><div class="item"><span>貼紙互動次數／觸及帳號數</span><b>${fmt(rate(sum(stickerRows,'sticker'),sum(stickerRows,'reach')),2)}%</b></div><div class="small muted section">這些是「互動次數比率」，不代表不重複互動人數比例。只納入分子與分母都有填寫的紀錄。</div></section></div><section class="panel section"><h2>觸及最高的 5 則限動</h2>${top.map((x,i)=>`<div class="item"><div><b>${i+1}. ${esc(x.p.date)}｜${esc(x.p.topic)}（0${x.i+1}）</b><div class="small muted">${esc(x.p.slides[x.i]?.category||x.p.category)}</div></div><b>${fmt(x.r.reach)}</b></div>`).join('')}</section><div class="notice section">分析提醒：樣本數較少時，排名和平均值可能受個別限動影響。建議搭配內容、發布時間與觀察時間一起解讀，避免直接推論因果。</div>`}
function reportView(){let rows=metrics(),ps=plans(),published=ps.filter(x=>x.status==='published').length;let best=rows.filter(x=>validNum(x.r.reach)!==null).sort((a,b)=>b.r.reach-a.r.reach)[0];let summary=`${month} 限動月度報告\n\n企劃天數：${ps.length}\n已發布天數：${published}\n已記錄限動：${rows.length}\n平均觸及：${fmt(avg(rows,'reach'),1)}\n觀看次數合計：${fmt(sum(rows,'views'))}\n回覆次數合計：${fmt(sum(rows,'replies'))}\n貼紙互動次數合計：${fmt(sum(rows,'sticker'))}\n觸及最高限動：${best?`${best.p.date} ${best.p.topic}（0${best.i+1}），觸及 ${best.r.reach}`:'尚無資料'}\n\n備註：統計僅來自已輸入的實際數據；缺漏值不等於零。`;return `<section class="panel"><h2>${esc(month)} 月度經營摘要</h2><div class="reporttext">${esc(summary)}</div><div class="toolbar section"><button class="btn primary" id="exportCSV">下載本月數據 CSV</button><button class="btn" id="exportPackage">下載 GPT 分析資料包 JSON</button><button class="btn" id="printReport">列印／另存 PDF</button></div></section><section class="panel section"><h2>資料管理與備份</h2><p class="muted">完整備份包含所有月份的企劃、文案、數據與備註。建議每週及月底各備份一次。</p><div class="toolbar"><button class="btn primary" id="exportBackup">下載完整 JSON 備份</button><button class="btn" id="importBackup">匯入完整 JSON 備份</button></div><div class="notice section">匯入完整備份會覆蓋目前瀏覽器中的全部資料。操作前請先下載現有備份。手機與電腦的資料不會自動同步。</div></section><section class="panel section"><h2>提供給 ChatGPT 的分析建議</h2><p class="reporttext">下載「GPT 分析資料包 JSON」後上傳至 ChatGPT，並要求：分析本月不同主題與限動位置的成效，指出樣本數及資料缺漏，提出下個月可測試的內容方向，規劃每週三天、每天可彈性安排則數的限動企劃，包含完整文案、畫面建議、互動貼紙及發布目的。</p><button class="btn" id="copyPrompt">複製分析提示詞</button></section>`}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function backup(){download(`限動經營工作台-完整備份-${dateNow()}.json`,JSON.stringify(db,null,2),'application/json;charset=utf-8');toast('完整備份已下載')}
function csv(){let cols=['日期','時間','主題','分類','發布狀態','實際發布時間','限動位置','完整文案','畫面建議','貼紙','發布目的','觸及','觀看','回覆','貼紙互動','連結點擊','個人檔案造訪','分享','返回','下一則','退出','擷取時間','備註'];let data=[cols];for(let p of plans())for(let i=0;i<p.slides.length;i++){let s=p.slides[i]||{},r=rec(p.id,i);data.push([p.date,p.time,p.topic,p.category,p.status,p.publishedAt,`0${i+1}`,s.copy,s.visual,s.sticker,s.goal,r.reach,r.views,r.replies,r.sticker,r.link,r.profile,r.shares,r.back,r.forward,r.exits,r.measuredAt,r.note])}download(`限動成效-${month}.csv`,'\ufeff'+data.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function packageData(){let ps=plans();return {exportType:'gpt-monthly-story-analysis',schemaVersion:1,month,generatedAt:new Date().toISOString(),note:'空白指標代表未取得，請勿當作零；數據不代表因果。',plans:ps,records:Object.fromEntries(Object.entries(db.records).filter(([k])=>ps.some(p=>k.startsWith(p.id+':'))))}}
function validatePlan(p){return p&&typeof p==='object'&&/^\d{4}-\d{2}-\d{2}$/.test(p.date)&&typeof p.topic==='string'&&p.topic.trim()&&Array.isArray(p.slides)&&p.slides.length>=1&&p.slides.length<=100}
function bind(){document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>setPage(x.dataset.page));document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>{selectedId=x.dataset.open;setPage('plan');openEditor(selectedId)});document.querySelectorAll('[data-record]').forEach(x=>x.onclick=()=>{selectedId=x.dataset.record;recordSlide=0;setPage('record')});document.querySelectorAll('[data-day]').forEach(x=>x.onclick=()=>{let p=plans().find(p=>p.date===x.dataset.day);openEditor(p?.id||null,x.dataset.day)});document.querySelectorAll('[data-delete]').forEach(x=>x.onclick=()=>{let p=db.plans.find(p=>p.id===x.dataset.delete);if(confirm(`確定刪除「${p.topic}」與全部限動數據？`)){db.plans=db.plans.filter(q=>q.id!==p.id);for(let i=0;i<p.slides.length;i++)delete db.records[`${p.id}:${i}`];save();render();toast('已刪除')}});if($('newPlan'))$('newPlan').onclick=()=>openEditor();if($('recordPlan'))$('recordPlan').onchange=e=>{selectedId=e.target.value;recordSlide=0;render()};document.querySelectorAll('[data-slide]').forEach(x=>x.onclick=()=>{recordSlide=Number(x.dataset.slide);render()});if($('recordForm'))$('recordForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),r={...rec(selectedId,recordSlide)};for(let k of ['reach','views','replies','sticker','link','shares']){let v=f.get(k);r[k]=v===''?null:Number(v)}r.measuredAt=f.get('measuredAt');r.note=f.get('note');db.records[`${selectedId}:${recordSlide}`]=r;if(save()){render();toast('數據已儲存')}};if($('clearRecord'))$('clearRecord').onclick=()=>{if(confirm('確定清除此則限動的所有數據？')){delete db.records[`${selectedId}:${recordSlide}`];save();render()}};if($('exportBackup'))$('exportBackup').onclick=backup;if($('exportCSV'))$('exportCSV').onclick=csv;if($('exportPackage'))$('exportPackage').onclick=()=>download(`GPT限動分析資料包-${month}.json`,JSON.stringify(packageData(),null,2),'application/json;charset=utf-8');if($('printReport'))$('printReport').onclick=()=>window.print();if($('copyPrompt'))$('copyPrompt').onclick=()=>copy('請分析附件中的 Instagram 限動月度資料：比較內容主題、不同限動位置、互動方式與每週趨勢；說明樣本數與缺漏限制，不要推論因果；並規劃下個月每週三天、每天可彈性安排則數的完整限動企劃，包含文案、畫面建議、互動貼紙與發布目的。');if($('importBackup'))$('importBackup').onclick=()=>fileImport('backup');if($('importPlan'))$('importPlan').onclick=()=>fileImport('plan');if($('exportPlan'))$('exportPlan').onclick=()=>download(`限動企劃-${month}.json`,JSON.stringify({plans:plans()},null,2),'application/json;charset=utf-8')}
function openEditor(id,date){if(page!=='plan')setPage('plan');editingId=id;let p=id?db.plans.find(p=>p.id===id):{date:date||`${month}-01`,time:'19:00',topic:'',category:CATS[0],status:'planned',slides:[{}]};if(!p)return;
$('editor').innerHTML=editor(p);$('editSection').scrollIntoView({behavior:'smooth',block:'start'});$('closeEdit').onclick=()=>{$('editor').innerHTML=''};
let slides=p.slides.map(x=>({...x}));
function readSlides(){let f=new FormData($('planForm'));slides=slides.map((x,i)=>({title:String(f.get(`title${i}`)||''),category:String(f.get(`category${i}`)||'其他'),copy:String(f.get(`copy${i}`)||''),visual:String(f.get(`visual${i}`)||''),sticker:String(f.get(`sticker${i}`)||''),goal:String(f.get(`goal${i}`)||'')}))}
function redraw(){ $('slideEditors').innerHTML=slides.map((x,i)=>slideEditor(x,i)).join('');document.querySelectorAll('[data-remove-slide]').forEach(b=>b.onclick=()=>{if(slides.length<=1){alert('每天至少保留一則限動。');return}readSlides();let i=Number(b.dataset.removeSlide);if(editingId&&Object.keys(db.records).some(k=>k.startsWith(editingId+':'))&&!confirm('移除此則會在儲存時調整後續限動的成效位置，且刪除這則的數據。請確認已備份。'))return;slides.splice(i,1);removedIndices.push(originalIndices[i]);originalIndices.splice(i,1);redraw()})}
let originalIndices=slides.map((_,i)=>i),removedIndices=[];redraw();
$('addSlide').onclick=()=>{readSlides();if(slides.length>=100){alert('單日最多 100 則。');return}slides.push({});originalIndices.push(null);redraw();$('addSlide').scrollIntoView({behavior:'smooth',block:'center'})};
$('planForm').onsubmit=e=>{e.preventDefault();readSlides();let f=new FormData(e.target),d=f.get('date');if(db.plans.some(x=>x.date===d&&x.id!==editingId)){alert('此日期已經有一組限動企劃，請直接編輯原本的企劃。');return}let np={id:editingId||('p_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)),date:d,time:f.get('time'),topic:String(f.get('topic')).trim(),category:f.get('category'),status:f.get('status'),publishedAt:f.get('publishedAt'),slides};if(editingId){let idx=db.plans.findIndex(x=>x.id===editingId);db.plans[idx]=np;let old=Object.fromEntries(Object.entries(db.records).filter(([k])=>k.startsWith(editingId+':')));for(let k of Object.keys(old))delete db.records[k];originalIndices.forEach((oi,i)=>{if(oi!==null&&old[`${editingId}:${oi}`])db.records[`${editingId}:${i}`]=old[`${editingId}:${oi}`]})}else db.plans.push(np);if(save()){selectedId=np.id;render();toast('企劃已儲存')}};
$('copyPlan').onclick=()=>{readSlides();copy(slides.map((x,i)=>`限動 ${String(i+1).padStart(2,'0')}｜${x.title||''}\n${x.copy}`).join('\n\n'))}}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('已複製到剪貼簿')}catch(e){let ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('已複製')}}
let importMode='backup';function fileImport(mode){importMode=mode;$('importFile').value='';$('importFile').click()}
$('importFile').addEventListener('change',async e=>{let file=e.target.files?.[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(importMode==='backup'){if(obj.schemaVersion!==1||!Array.isArray(obj.plans)||!obj.plans.every(validatePlan)||!obj.records||typeof obj.records!=='object'||Array.isArray(obj.records))throw Error('不是相容的完整備份格式');if(!confirm('匯入完整備份將覆蓋目前所有資料，確定繼續？'))return;db={schemaVersion:1,plans:obj.plans,records:obj.records,updatedAt:obj.updatedAt||null};if(save()){render();toast('完整備份已還原')}}else{let list=Array.isArray(obj)?obj:obj.plans;if(!Array.isArray(list)||!list.every(validatePlan))throw Error('企劃 JSON 格式不正確');let count=0;for(let p of list){if(db.plans.some(x=>x.date===p.date))continue;let id='p_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);db.plans.push({id,date:p.date,time:p.time||'19:00',topic:p.topic,category:CATS.includes(p.category)?p.category:CATS[0],status:'planned',publishedAt:'',slides:p.slides.map(s=>({title:String(s.title||''),category:CATS.includes(s.category)?s.category:(CATS.includes(p.category)?p.category:'其他'),copy:String(s.copy||''),visual:String(s.visual||''),sticker:String(s.sticker||''),goal:String(s.goal||'')}))});count++}save();render();toast(`成功匯入 ${count} 個企劃（同日期略過）`)}}catch(err){alert('匯入失敗：'+err.message)}});
$('month').addEventListener('change',e=>{month=e.target.value;selectedId=null;render()});$('backupTop').onclick=backup;render();
